name: Build macOS app

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/build-macos.yml
      - src/**
      - static/**
      - src-tauri/**
      - "!src-tauri/gen/android/**"
      - "!src-tauri/tauri.android.conf.json"
      - package.json
      - bun.lock
      - svelte.config.js
      - tsconfig.json
      - vite.config.ts
      - postcss.config.js
      - tailwind.config.js
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-macos.yml
      - src/**
      - static/**
      - src-tauri/**
      - "!src-tauri/gen/android/**"
      - "!src-tauri/tauri.android.conf.json"
      - package.json
      - bun.lock
      - svelte.config.js
      - tsconfig.json
      - vite.config.ts
      - postcss.config.js
      - tailwind.config.js

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build universal macOS DMG
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Set up Rust with macOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build files
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: macos-universal

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build universal macOS DMG
        run: bun run tauri build -- --target universal-apple-darwin --bundles dmg --config src-tauri/tauri.macos-ci.conf.json

      - name: Prepare public macOS package
        run: |
          mkdir -p release-assets
          dmg=$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -type f -name "*.dmg" -print -quit)
          if [ -z "$dmg" ]; then
            echo "Tauri did not produce a macOS DMG." >&2
            exit 1
          fi
          cp "$dmg" release-assets/holotrace-macos-universal.dmg

      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: holotrace-macos-${{ github.sha }}
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/**
            release-assets/holotrace-macos-universal.dmg
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish latest macOS build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download macOS packages
        uses: actions/download-artifact@v5
        with:
          name: holotrace-macos-${{ github.sha }}

      - name: Publish latest macOS build
        uses: softprops/action-gh-release@v3
        with:
          tag_name: macos-latest
          target_commitish: ${{ github.sha }}
          name: Latest Holotrace macOS build
          body: |
            Automated universal development build from `main` for Apple Silicon and Intel Macs.

            Source commit: `${{ github.sha }}`

            This DMG uses ad hoc signing and is not notarized. macOS may require approval in Privacy & Security before launch.
          prerelease: true
          make_latest: false
          files: release-assets/holotrace-macos-universal.dmg
          fail_on_unmatched_files: true
