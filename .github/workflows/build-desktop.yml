name: Build desktop app

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-desktop.yml
      - src/**
      - static/**
      - src-tauri/**
      - "!src-tauri/gen/android/**"
      - "!src-tauri/tauri.android.conf.json"
      - package.json
      - bun.lock
      - svelte.config.js
      - tsconfig.json
      - vite.config.ts
      - postcss.config.js
      - tailwind.config.js

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows desktop app
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build files
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build desktop app
        run: bun run tauri build

      - name: Prepare public Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          $installer = Get-ChildItem src-tauri/target/release/bundle -Recurse -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Tauri did not produce a Windows setup executable."
          }
          Copy-Item -LiteralPath $installer.FullName -Destination release-assets/holotrace-windows-x64-setup.exe

      - name: Upload desktop packages
        uses: actions/upload-artifact@v4
        with:
          name: holotrace-windows-${{ github.sha }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14

      - name: Publish latest Windows build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: desktop-latest
          target_commitish: ${{ github.sha }}
          name: Latest Holotrace Windows build
          body: |
            Automated development build from `main`.

            Source commit: `${{ github.sha }}`

            This installer is currently unsigned. Your browser or Windows may show a warning before installation.
          prerelease: true
          make_latest: false
          files: release-assets/holotrace-windows-x64-setup.exe
          fail_on_unmatched_files: true
