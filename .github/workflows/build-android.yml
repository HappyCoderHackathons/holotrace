name: Build Android app

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-android.yml
      - src/**
      - static/**
      - src-tauri/**
      - package.json
      - bun.lock
      - svelte.config.js
      - tsconfig.json
      - vite.config.ts
      - postcss.config.js
      - tailwind.config.js

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Set up Rust with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust build files
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: android

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          link-to-sdk: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build debug APK
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: bun run android:build -- --debug --apk

      - name: Prepare public Android package
        run: |
          mkdir -p release-assets
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -type f -name "*.apk" -print -quit)
          if [ -z "$apk" ]; then
            echo "Tauri did not produce an Android APK." >&2
            exit 1
          fi
          cp "$apk" release-assets/holotrace-android-debug.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: holotrace-android-${{ github.sha }}
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish latest Android build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: android-latest
          target_commitish: ${{ github.sha }}
          name: Latest Holotrace Android build
          body: |
            Automated development build from `main`.

            Source commit: `${{ github.sha }}`

            This APK uses Android debug signing and is intended for testing current development builds.
          prerelease: true
          make_latest: false
          files: release-assets/holotrace-android-debug.apk
          fail_on_unmatched_files: true
