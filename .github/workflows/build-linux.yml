name: Build Linux app

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/build-linux.yml
      - src/**
      - static/**
      - src-tauri/**
      - "!src-tauri/gen/android/**"
      - "!src-tauri/tauri.android.conf.json"
      - package.json
      - bun.lock
      - svelte.config.js
      - tsconfig.json
      - vite.config.ts
      - postcss.config.js
      - tailwind.config.js
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-linux.yml
      - src/**
      - static/**
      - src-tauri/**
      - "!src-tauri/gen/android/**"
      - "!src-tauri/tauri.android.conf.json"
      - package.json
      - bun.lock
      - svelte.config.js
      - tsconfig.json
      - vite.config.ts
      - postcss.config.js
      - tailwind.config.js

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Linux AppImage
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build files
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: linux-x86_64

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Linux AppImage
        env:
          HOLOTRACE_MODEL_API_URL: ${{ secrets.HOLOTRACE_MODEL_API_URL }}
          HOLOTRACE_ML_API_KEY: ${{ secrets.HOLOTRACE_ML_API_KEY }}
        run: bun run tauri build --bundles appimage

      - name: Prepare public Linux package
        run: |
          mkdir -p release-assets
          appimage=$(find src-tauri/target/release/bundle/appimage -type f -name "*.AppImage" -print -quit)
          if [ -z "$appimage" ]; then
            echo "Tauri did not produce a Linux AppImage." >&2
            exit 1
          fi
          cp "$appimage" release-assets/holotrace-linux-x86_64.AppImage
          chmod +x release-assets/holotrace-linux-x86_64.AppImage

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: holotrace-linux-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/**
            release-assets/holotrace-linux-x86_64.AppImage
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish latest Linux build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Linux packages
        uses: actions/download-artifact@v5
        with:
          name: holotrace-linux-${{ github.sha }}

      - name: Publish latest Linux build
        uses: softprops/action-gh-release@v3
        with:
          tag_name: linux-latest
          target_commitish: ${{ github.sha }}
          name: Latest Holotrace Linux build
          body: |
            Automated x86_64 development build from `main`.

            Source commit: `${{ github.sha }}`

            Make the AppImage executable before launching it: `chmod +x holotrace-linux-x86_64.AppImage`.
          prerelease: true
          make_latest: false
          files: release-assets/holotrace-linux-x86_64.AppImage
          fail_on_unmatched_files: true
